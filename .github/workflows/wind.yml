name: Update wind.json

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 06:00 UTC, Mon-Fri (before the London session)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch winds from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_wind.py

      - name: Commit wind.json if it changed
        run: |
          git config user.name  "wind-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wind.json
          git diff --staged --quiet || git commit -m "wind.json $(date -u +%F)"
          git push
