name: Update vix.json

on:
  schedule:
    - cron: "10 6 * * 1-5"   # 06:10 UTC, Mon-Fri (just after the wind job)
  workflow_dispatch:          # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  vix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch VIX regime from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_vix.py

      - name: Commit vix.json if it changed
        run: |
          git config user.name  "vix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vix.json
          git diff --staged --quiet || git commit -m "vix.json $(date -u +%F)"
          git push
